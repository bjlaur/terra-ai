[pytest]
asyncio_mode = auto
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    real: marks tests that hit real API (requires --real + key)
    mock: marks tests that always use mocked provider
    broken: marks tests that are known broken — code works, test is wrong

# By default, skip slow tests, real API tests, and broken tests.
# Run mock tests (default): pytest
# Run real API tests:       pytest --real -m real
# Run everything:          pytest --real
addopts = -m "not slow and not real and not broken"
testpaths = tests
