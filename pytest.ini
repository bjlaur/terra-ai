[pytest]
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    real: marks tests that hit real API (deselect with '-m "not real"')

# By default, skip slow tests AND real API tests.
# Run slow tests:         pytest -m slow
# Run real API tests:    pytest --real -m real
# Run everything:        pytest -m ""
addopts = -m "not slow and not real"
testpaths = tests
