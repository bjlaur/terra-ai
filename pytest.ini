[pytest]
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    real: test that always requires real external services and --real
    mock: test that uses a local test double rather than external services
    e2e: plugin-routed scenario that uses scripted HTTP or --real services
    ergo: always-real IRC/Ergo/SOPEL process system test
    broken: marks tests that are known broken — code works, test is wrong
testpaths = tests
