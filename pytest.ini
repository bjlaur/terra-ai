[pytest]
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    real: marks tests that hit real API (deselect with '-m "not real"')
    broken: marks tests that are known broken — code works, test is wrong

# By default, skip slow tests, real API tests, and broken tests.
# Run slow tests:         pytest -m slow
# Run real API tests:    pytest --real -m real
# Run broken tests:       pytest -m broken
# Run everything:        pytest -m ""
addopts = -m "not slow and not real and not broken"
testpaths = tests
